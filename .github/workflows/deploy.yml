name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  GCP_PROJECT: trove-prod-485922
  GCP_REGION: us-east1
  SERVICE_NAME: trove-api
  IMAGE: us-east1-docker.pkg.dev/trove-prod-485922/trove-api/trove-api

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/505795335067/locations/global/workloadIdentityPools/github-actions/providers/github-provider
          service_account: github-actions-deploy@trove-prod-485922.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v3

      - run: gcloud auth configure-docker us-east1-docker.pkg.dev --quiet

      - name: Build and push
        run: |
          docker build -t $IMAGE:$GITHUB_SHA -t $IMAGE:latest .
          docker push $IMAGE:$GITHUB_SHA
          docker push $IMAGE:latest
        env:
          IMAGE: ${{ env.IMAGE }}

      # THIS COMMAND MUST KEEP SETTING ONLY THE IMAGE. Do not add --set-env-vars,
      # --memory, --cpu, --min-instances, --service-account or anything else.
      #
      # The service's shape — env vars, secret bindings, scaling, CPU and memory,
      # probes, runtime identity and the Cloud SQL attachment — is declared as
      # infrastructure as code and owned there. This workflow owns exactly one
      # field, the image tag, and the two systems stay out of each other's way
      # only because `gcloud run services update` MERGES rather than replaces.
      #
      # That boundary is enforced on the other side by an `ignore_changes` on the
      # image. Widening this command does not cause a conflict or an error: it
      # silently makes that ignore a lie, and drift detection for this service
      # stops working with nothing anywhere reporting it. If the service needs a
      # different shape, change it in the infrastructure repo, not here.
      - name: Deploy to Cloud Run
        run: |
          gcloud run services update $SERVICE_NAME \
            --image $IMAGE:$GITHUB_SHA \
            --region $GCP_REGION \
            --project $GCP_PROJECT
        env:
          IMAGE: ${{ env.IMAGE }}
          SERVICE_NAME: ${{ env.SERVICE_NAME }}
          GCP_REGION: ${{ env.GCP_REGION }}
          GCP_PROJECT: ${{ env.GCP_PROJECT }}
