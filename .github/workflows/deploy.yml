name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  GCP_PROJECT: trove-prod-485922
  GCP_REGION: us-east1
  SERVICE_NAME: trove-api
  IMAGE: us-east1-docker.pkg.dev/trove-prod-485922/trove-api/trove-api

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/505795335067/locations/global/workloadIdentityPools/github-actions/providers/github-provider
          service_account: github-actions-deploy@trove-prod-485922.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v3

      - run: gcloud auth configure-docker us-east1-docker.pkg.dev --quiet

      - name: Build and push
        run: |
          docker build -t $IMAGE:$GITHUB_SHA -t $IMAGE:latest .
          docker push $IMAGE:$GITHUB_SHA
          docker push $IMAGE:latest
        env:
          IMAGE: ${{ env.IMAGE }}

      - name: Deploy to Cloud Run
        run: |
          gcloud run services update $SERVICE_NAME \
            --image $IMAGE:$GITHUB_SHA \
            --region $GCP_REGION \
            --project $GCP_PROJECT
        env:
          IMAGE: ${{ env.IMAGE }}
          SERVICE_NAME: ${{ env.SERVICE_NAME }}
          GCP_REGION: ${{ env.GCP_REGION }}
          GCP_PROJECT: ${{ env.GCP_PROJECT }}
